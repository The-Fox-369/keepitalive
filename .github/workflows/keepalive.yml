name: Minefort Server Keeper

on:
  schedule:
    # Runs automatically once every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Keep-Alive Script
        run: |
          python -c "import urllib.request; print('Daily runner active!')"
