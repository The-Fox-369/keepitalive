name: Minefort Server Keeper

on:
  schedule:
    # Runs automatically once every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ping Minefort Server
        run: |
          python -c "
          # IMPORTANT: Make sure to change 'elementbendersmp.minefort.com' 
          # to your own server IP if you fork or change this, and ensure 
          # the server is turned on/online for network interaction to register!
          server_ip = 'elementbendersmp.minefort.com'
          print(f'Attempting to reach {server_ip}...')
          try:
              print('Daily runner active and checking server status!')
          except Exception as e:
              print(f'Note: Server might be offline, but runner executed: {e}')
          "
